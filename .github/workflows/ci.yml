name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The tests never load a checkpoint, so torch and ultralytics are not
          # needed here; the model module degrades to "no model loaded".
          pip install \
            "fastapi>=0.115,<1" "uvicorn[standard]>=0.34,<1" python-multipart \
            "pydantic>=2.9,<3" "rasterio>=1.3,<2" "rio-tiler>=6.6,<8" \
            "pyproj>=3.6,<4" "shapely>=2.0,<3" "numpy>=1.24" "pandas>=2.0,<3" \
            "pillow>=10.3" "fpdf2>=2.7" "pytest>=8.0" "httpx>=0.27"

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse every module
        run: |
          status=0
          for file in frontend/js/*.js frontend/js/panels/*.js; do
            if node --input-type=module --check < "$file"; then
              echo "ok   $file"
            else
              echo "FAIL $file"
              status=1
            fi
          done
          exit $status

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t plantai:ci .
