server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tile responses are immutable per dataset id; everything else is small.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 8g;

        # Detection progress arrives as server-sent events; buffering it would
        # hold the whole stream until the run finished.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location /vendor/ { expires 30d; add_header Cache-Control "public, immutable"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
